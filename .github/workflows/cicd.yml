name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/bootbale-modderforker

            # Pull the latest code from the private repository
            git pull origin main
            
            # Create/Overwrite the .env file with values from GitHub Secrets
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # Install dependencies
            npm install
            
            # Restart all processes with new environment variables
            pm2 restart all --update-env
